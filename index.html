<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganpati Bappa Morya 🙏❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#fff7df,#ffd59b 45%,#ff9d7a);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}

.card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,.96);
    border-radius:32px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    position:relative;
    z-index:5;
    animation:cardIn 1s ease;
}

.ganpati{
    font-size:100px;
    line-height:1;
    animation:ganpati 2s infinite ease-in-out;
}

h1{
    margin-top:15px;
    color:#b84d00;
    font-size:31px;
}

.title{
    color:#e07000;
    font-size:21px;
    font-weight:bold;
    margin-top:12px;
}

.message{
    color:#555;
    font-size:18px;
    line-height:1.7;
    margin-top:15px;
}

.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:22px;
}

button{
    border:0;
    border-radius:30px;
    padding:15px 22px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

button:active{
    transform:scale(.95);
}

.yes{
    background:#e67e22;
    color:white;
}

.no{
    background:#777;
    color:white;
}

textarea{
    display:none;
    width:100%;
    height:110px;
    margin-top:20px;
    padding:14px;
    border:2px solid #ed9b54;
    border-radius:18px;
    font-size:16px;
    resize:none;
    outline:none;
}

.send{
    display:none;
    width:100%;
    margin-top:12px;
    background:#e67e22;
    color:white;
}

.status{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:15px;
    font-weight:bold;
    word-break:break-word;
}

.error{
    background:#ffe3e3;
    color:#c0392b;
}

.success{
    background:#ddf8e7;
    color:#16803c;
}

.floating{
    position:fixed;
    bottom:-60px;
    font-size:32px;
    z-index:1;
    animation:float 7s linear infinite;
}

.f1{left:5%;animation-delay:0s}
.f2{left:20%;animation-delay:1.5s}
.f3{left:40%;animation-delay:3s}
.f4{left:65%;animation-delay:2s}
.f5{left:85%;animation-delay:4s}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.5) translateY(80px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes ganpati{
    0%,100%{
        transform:translateY(0) rotate(-2deg);
    }
    50%{
        transform:translateY(-12px) rotate(2deg);
    }
}

@keyframes float{
    0%{
        bottom:-60px;
        opacity:0;
        transform:rotate(0deg);
    }
    15%{
        opacity:1;
    }
    100%{
        bottom:110vh;
        opacity:0;
        transform:rotate(360deg);
    }
}

@media(max-width:450px){

    .card{
        padding:25px 18px;
    }

    .ganpati{
        font-size:80px;
    }

    h1{
        font-size:27px;
    }

    .title{
        font-size:19px;
    }

    .message{
        font-size:16px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="floating f1">🙏</div>
<div class="floating f2">🌺</div>
<div class="floating f3">🪔</div>
<div class="floating f4">❤️</div>
<div class="floating f5">🙏</div>

<div class="container">

<div class="card">

    <div class="ganpati">
        🙏🐘
    </div>

    <h1>Ganpati Bappa Morya! 🙏❤️</h1>

    <div class="title">
        Mere Bestfriend Ke Liye ❤️
    </div>

    <div class="message">
        Bappa se ek special wish maangi hai... 🥰
        <br><br>

        <b>
            Is baar mere saath Biryani khane chalegi? 🍛😋
        </b>

        <br><br>

        Bappa Morya! 🙏✨
    </div>

    <div class="buttons" id="buttons">

        <button class="yes" onclick="chooseAnswer('YES')">
            ❤️ Haan Chalo!
        </button>

        <button class="no" onclick="chooseAnswer('NO')">
            😅 Nahi
        </button>

    </div>

    <textarea
        id="reply"
        placeholder="Apna message yahan likho... ❤️">
    </textarea>

    <button
        class="send"
        id="sendButton"
        onclick="sendAnswer()">
        📩 Answer Bhejo 🙏
    </button>

    <div
        id="status"
        class="status">
    </div>

</div>

</div>

<script>

let selectedAnswer = "";


/* YES / NO select */

function chooseAnswer(answer){

    selectedAnswer = answer;

    document.getElementById("buttons").style.display = "none";

    document.getElementById("reply").style.display = "block";

    document.getElementById("sendButton").style.display = "block";

    const title = document.querySelector("h1");
    const subtitle = document.querySelector(".title");

    if(answer === "YES"){

        title.innerHTML =
            "Ganpati Bappa Morya! 🙏❤️";

        subtitle.innerHTML =
            "Biryani Party Confirmed! 🍛😋";

    }else{

        title.innerHTML =
            "Achhaaa Bestfriend 😭😂";

        subtitle.innerHTML =
            "Apna reason bhi batao 😅";

    }
}


/* Telegram ko answer bhejna */

async function sendAnswer(){

    const replyBox =
        document.getElementById("reply");

    const sendButton =
        document.getElementById("sendButton");

    const status =
        document.getElementById("status");

    const message =
        replyBox.value.trim();


    if(!selectedAnswer){

        showError("Pehle YES ya NO select karo.");

        return;
    }


    sendButton.disabled = true;

    sendButton.innerText =
        "⏳ Sending...";


    status.style.display = "none";


    try{

        const response = await fetch(
            "/.netlify/functions/telegram",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    answer:selectedAnswer,

                    message:message

                })
            }
        );


        /*
        Response JSON read karna
        */

        let data;

        try{

            data = await response.json();

        }catch(jsonError){

            throw new Error(
                "Server ne valid response nahi diya. HTTP " +
                response.status
            );

        }


        /*
        Agar backend error bhejta hai
        */

        if(!response.ok || !data.success){

            throw new Error(
                data.error ||
                "Telegram message send nahi hua. HTTP " +
                response.status
            );

        }


        /*
        Success
        */

        status.className =
            "status success";

        status.style.display =
            "block";

        status.innerHTML =
            "✅ Answer successfully Telegram par bhej diya! ❤️🙏";


        sendButton.style.display =
            "none";

        replyBox.disabled =
            true;


    }catch(error){

        console.error(error);


        /*
        EXACT ERROR SCREEN PAR DIKHAYEGA
        */

        showError(
            "❌ " +
            (error.message ||
            "Unknown error")
        );


        sendButton.disabled =
            false;

        sendButton.innerText =
            "📩 Answer Bhejo 🙏";
    }
}


/* Error show */

function showError(text){

    const status =
        document.getElementById("status");

    status.className =
        "status error";

    status.style.display =
        "block";

    status.innerText =
        text;
}

</script>

</body>
</html>
